<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Portfolio - Contact Me</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="contact-content">
            <h2>Get In Touch</h2>
            <section id="contact-form-section">
                <h3>Send Me a Message</h3>
                <form action="#" method="POST">
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit">Send Message</button>
                </form>
            </section>
            <section id="other-contact-info">
                <h3>Other Ways to Connect</h3>
                <p>You can also reach me directly at: <a href="mailto:designer@example.com">designer@example.com</a>.</p>
                <p>Find me on <a href="#">LinkedIn</a> / <a href="#">Instagram</a>.</p>
            </section>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Your Name. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
